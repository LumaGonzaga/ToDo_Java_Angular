<section class="page">
  <header class="page-header">
    <h1>{{ isEditing ? 'Editar tarefa' : 'Nova tarefa' }}</h1>
  </header>

  <p class="hint" *ngIf="loading">Carregando tarefa...</p>
  <p class="hint hint-error" *ngIf="!loading && loadError">
    Não foi possível carregar esta tarefa.
  </p>

  <form class="todo-form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading && !loadError">
    <div class="field">
      <label for="titulo">Título *</label>
      <input id="titulo" type="text" formControlName="titulo" maxlength="100" />
      <small class="field-error" *ngIf="form.get('titulo')?.invalid && form.get('titulo')?.touched">
        Informe o título da tarefa.
      </small>
    </div>

    <div class="field">
      <label for="descricao">Descrição *</label>
      <textarea id="descricao" formControlName="descricao" rows="4" maxlength="100"></textarea>
      <small class="field-error" *ngIf="form.get('descricao')?.invalid && form.get('descricao')?.touched">
        Informe a descrição da tarefa.
      </small>
    </div>

    <div class="field">
      <label for="status">Status *</label>
      <select id="status" formControlName="status">
        <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="saving">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Salvando...' : (isEditing ? 'Salvar alterações' : 'Criar tarefa') }}
      </button>
    </div>
  </form>
</section>
