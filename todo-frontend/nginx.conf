server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas da API para o backend dentro da rede do Docker Compose,
    # mantendo front e back na mesma origem do ponto de vista do navegador (sem CORS).
    location /todo {
        proxy_pass http://backend:8080/todo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte às rotas do Angular (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
